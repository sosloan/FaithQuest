name: Swift Package Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-macos:
    name: Build and Test (macOS)
    runs-on: macos-14
    permissions:
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Show Swift version
      run: swift --version
      
    - name: Build Package
      run: swift build
      
    - name: Run Tests
      run: swift test
      
  build-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: '5.9'
        
    - name: Show Swift version
      run: swift --version
      
    - name: Build Package
      run: swift build
      
    - name: Run Tests
      run: swift test
